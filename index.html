<title>Результати навчання студентів</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 40px;
    }

    h1 {
        text-align: center;
        color: #222;
    }

    table {
        border-collapse: collapse;
        width: 80%;
        margin: 30px auto;
        background-color: white;
    }

    th,
    td {
        border: 1px solid #333;
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #ddd;
    }

    .student {
        text-align: left;
        font-weight: bold;
    }

    .summary {
        font-weight: bold;
        text-align: left;
        background-color: #eee;
    }
</style>
<h1>Результати навчання студентів</h1>

    </tr>

    </tr>
